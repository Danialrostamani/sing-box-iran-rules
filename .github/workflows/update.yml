name: Update rule-sets

on:
  schedule:
    # هر روز ساعت ۰۳:۰۰ تهران = ۲۳:۳۰ UTC روز قبل (ایران از ۱۴۰۱ ساعت تابستانی ندارد)
    - cron: "30 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "iran-one-srs.sh"
      - ".github/workflows/update.yml"

concurrency:
  group: update-rulesets
  cancel-in-progress: true

permissions:
  contents: write

env:
  FILES: >-
    iran-all-domains.srs iran-all-ips.srs
    ads-merged-domains.srs ads-merged-ips.srs
    iran-all-domains.json iran-all-ips.json
    ads-merged-domains.json ads-merged-ips.json
  # تعداد Releaseهای روزانه‌ای که نگه داشته می‌شوند (قدیمی‌ترها حذف می‌شوند)
  KEEP_RELEASES: "7"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sing-box
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # با توکن، تا محدودیت ۶۰ درخواست/ساعت API ناشناس باعث شکست نشود
          VER=$(gh release view -R SagerNet/sing-box --json tagName -q .tagName | sed 's/^v//')
          echo "sing-box $VER"
          curl -fsSL -o /tmp/sb.tgz \
            "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tgz -C /tmp
          sudo install -m 0755 /tmp/sing-box-*/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Build rule-sets (domains and IPs separated)
        run: |
          set -euo pipefail
          chmod +x iran-one-srs.sh
          mkdir -p dist
          ./iran-one-srs.sh --yes --report -d dist
          cd dist
          for f in $FILES; do test -s "$f" || { echo "missing: $f"; exit 1; }; done
          sha256sum $FILES | tee SHA256SUMS
          ls -lh

      - name: Publish files to release branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # تاریخ به وقت تهران (اجرا ۲۳:۳۰ UTC است و تاریخ UTC یک روز عقب می‌افتد)
          TAG=$(TZ=Asia/Tehran date +%Y%m%d)
          DATE=$(TZ=Asia/Tehran date +'%Y-%m-%d %H:%M (Tehran)')
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan release
          git add $FILES report.txt SHA256SUMS
          git commit -m "update rule-sets ${TAG}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git push -f origin release

      - name: Purge jsDelivr cache
        continue-on-error: true
        run: |
          for f in $FILES report.txt SHA256SUMS; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/${f}" || true
          done

      - name: GitHub Release (latest + prune old)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="به‌روزرسانی خودکار ${DATE}

          | فایل | کاربرد |
          |---|---|
          | \`iran-all-domains.srs\` | دامنه‌های ایرانی → direct |
          | \`iran-all-ips.srs\` | رنج IPهای ایرانی → direct |
          | \`ads-merged-domains.srs\` | دامنه‌های تبلیغات، ردیاب، بدافزار، فیشینگ → reject |
          | \`ads-merged-ips.srs\` | IPهای بدافزار و فیشینگ → reject |

          ترتیب رول در sing-box: **اول ads-merged-*، بعد iran-all-***."
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          ASSETS=""
          for f in $FILES report.txt SHA256SUMS; do ASSETS="$ASSETS dist/$f"; done
          gh release create "$TAG" $ASSETS \
            --title "Rule-sets $TAG" \
            --notes "$NOTES" \
            --latest
          # فقط آخرین KEEP_RELEASES نسخهٔ روزانه (تگ‌های ۸ رقمی) نگه داشته می‌شوند
          gh release list --limit 200 --json tagName,createdAt \
            -q "[.[] | select(.tagName | test(\"^[0-9]{8}\$\"))] | sort_by(.createdAt) | reverse | .[${KEEP_RELEASES}:] | .[].tagName" \
            | while read -r t; do
                [ -n "$t" ] && gh release delete "$t" -y --cleanup-tag || true
              done
